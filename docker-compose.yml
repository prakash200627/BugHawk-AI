# Optional local stack. The API does not use Redis, and this repository has no worker.
# Render and Vercel do not use this file.

services:
  db:
    image: postgres:15-alpine
    container_name: bughawk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bughawk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bughawk_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bughawk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not used by the current API. Present only if a future worker needs it.
  redis:
    image: redis:7-alpine
    container_name: bughawk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bughawk_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bughawk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bughawk_db}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bughawk_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
